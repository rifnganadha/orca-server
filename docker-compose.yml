services:
  orca:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      platforms:
        - ${DOCKER_PLATFORM:-linux/amd64}
      args:
        ORCA_VERSION: ${ORCA_VERSION:-v1.4.197}
        DOCKER_CLI_VERSION: ${DOCKER_CLI_VERSION:-29.8.0}
        NODE_VERSION: ${NODE_VERSION:?Set NODE_VERSION in .env}
        SKILLS_CLI_VERSION: ${SKILLS_CLI_VERSION:?Set SKILLS_CLI_VERSION in .env}
        KILO_CLI_VERSION: ${KILO_CLI_VERSION:-7.5.14}
        REPOWISE_VERSION: ${REPOWISE_VERSION:-0.48.0}
    image: orca-server:${ORCA_VERSION:-v1.4.197}
    container_name: orca-server
    hostname: ${ORCA_HOSTNAME:-orca-server}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      ORCA_PORT: ${ORCA_PORT:-6770}
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:?Set ORCA_PAIRING_ADDRESS in .env}
      ORCA_WEB_USER: ${ORCA_WEB_USER:?Set ORCA_WEB_USER in .env}
      ORCA_WEB_PASSWORD: ${ORCA_WEB_PASSWORD:?Set ORCA_WEB_PASSWORD in .env}
      GIT_USER_NAME: ${GIT_USER_NAME:?Set GIT_USER_NAME in .env}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:?Set GIT_USER_EMAIL in .env}
      GH_TOKEN: ${GH_TOKEN:-}
      KILO_API_KEY: ${KILO_API_KEY:-}
      KILO_PROVIDER_ID: ${KILO_PROVIDER_ID:-9router}
      KILO_PROVIDER_NAME: ${KILO_PROVIDER_NAME:-9Router}
      KILO_PROVIDER_NPM: ${KILO_PROVIDER_NPM:-@ai-sdk/openai-compatible}
      KILO_BASE_URL: ${KILO_BASE_URL:-https://9router.akasia.dev/v1}
      KILO_MODEL_ID: ${KILO_MODEL_ID:-gpt-5.6-sol}
      KILO_MODEL_NAME: ${KILO_MODEL_NAME:-GPT-5.6 SOL}
      REPOWISE_ENABLED: ${REPOWISE_ENABLED:-true}
    ports:
      - "${ORCA_PORT:-6770}:6768"
      - "7339:7339"
    volumes:
      - orca-home:/home/orca
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orca-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6768'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  orca-home:

networks:
  orca-network:
    name: orca-network
