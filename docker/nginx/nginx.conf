pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map "$uri:$http_upgrade:$cookie_orca_session" $web_authenticated {
        default 0;
        "~^/login:" 1;
        "~^/auth-check:" 1;
        "~^[^:]+:.+:" 1;
        "~^[^:]+::@@SESSION_TOKEN@@$" 1;
    }
    map "$uri:$cookie_repowise_session" $repowise_authenticated {
        default 0;
        "~^/login:" 1;
        "~^/auth-check:" 1;
        "~^/repowise-session-check:" 1;
        "~^/[^:]*:@@REPOWISE_SESSION_TOKEN@@$" 1;
    }

    server {
        listen 6768;
        absolute_redirect off;

        if ($web_authenticated = 0) {
            return 302 /login;
        }

        location = /login {
            default_type text/html;
            alias @@LOGIN_PAGE@@;
        }
        location = /auth-check {
            auth_basic "Orca Web";
            auth_basic_user_file @@AUTH_FILE@@;
            add_header Cache-Control "no-store" always;
            add_header Set-Cookie "orca_session=@@SESSION_TOKEN@@; Path=/; HttpOnly; SameSite=Strict";
            default_type text/plain;
            alias @@LOGIN_PAGE@@;
        }
        location = / {
            add_header Cache-Control "no-store" always;
            error_page 418 = @orca_root;

            if ($http_upgrade != '') {
                return 418;
            }

            default_type text/html;
            root @@RUNTIME_DIR@@;
            try_files /index.html =404;
        }
        location @orca_root {
            proxy_pass http://127.0.0.1:6769;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            absolute_redirect off;
        }
        location = /mobile {
            add_header Cache-Control "no-store" always;
            default_type text/html;
            alias @@MOBILE_PAGE@@;
        }
        location = /mobile-pairing.svg {
            add_header Cache-Control "no-store" always;
            default_type image/svg+xml;
            alias @@MOBILE_QR@@;
        }
        location = /desktop {
            add_header Cache-Control "no-store" always;
            default_type text/html;
            alias @@DESKTOP_PAGE@@;
        }
        location = /desktop-pairing.svg {
            add_header Cache-Control "no-store" always;
            default_type image/svg+xml;
            alias @@DESKTOP_QR@@;
        }
        location = /web-index.html {
            proxy_pass http://127.0.0.1:6769;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/web-compat.js" data-advertised-endpoint="@@PAIRING_ENDPOINT@@" data-server-arch="@@SERVER_ARCH@@"></script>';
        }
        location = /web-compat.js {
            add_header Cache-Control "no-store" always;
            default_type application/javascript;
            alias /usr/local/share/orca-server/web/web-compat.js;
        }
        location ~ ^/assets/(FeatureWallSetupChecklist|FeatureTipsModal)-[^/]+\.js$ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://127.0.0.1:6769;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter 'forceHostRuntime:!!u.installDisabledReason' 'forceHostRuntime:!0';
            sub_filter 'forceHostRuntime:!!t.installDisabledReason' 'forceHostRuntime:!0';
        }
        location / {
            proxy_pass http://127.0.0.1:6769;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }

    server {
        listen 7339;

        if ($repowise_authenticated = 0) {
            return 302 /login;
        }

        location = /login {
            default_type text/html;
            alias @@REPOWISE_LOGIN_PAGE@@;
        }
        location = /auth-check {
            auth_basic "RepoWise Dashboard";
            auth_basic_user_file @@AUTH_FILE@@;
            add_header Cache-Control "no-store" always;
            add_header Set-Cookie "repowise_session=@@REPOWISE_SESSION_TOKEN@@; Path=/; HttpOnly; SameSite=Strict";
            default_type text/plain;
            return 204;
        }
        location = /repowise-session-check {
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            return 204;
        }
        location = /workspacee {
            return 302 /workspace;
        }
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:7337;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
        location ~ ^/_next/static/chunks/app/layout-[^/]+\.js$ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://127.0.0.1:7340;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            proxy_pass http://127.0.0.1:7340;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }

}
