<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Pair Orca @@TITLE@@</title>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #16212b; background: #f4f7f8; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; background: #f4f7f8; }
        .shell { display: grid; grid-template-columns: minmax(16rem, 0.78fr) minmax(22rem, 1.22fr); width: min(70rem, 100%); min-height: 100vh; margin: auto; background: #fff; box-shadow: 0 20px 60px rgb(22 33 43 / 10%); }
        .intro { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(2rem, 6vw, 5rem); color: #fff; background: #173b3f; }
        .mark { display: grid; width: 2.75rem; height: 2.75rem; place-items: center; border: 1px solid rgb(255 255 255 / 32%); border-radius: 10px; color: #173b3f; font-weight: 800; background: #c5f06d; }
        .eyebrow { margin: 0 0 1rem; color: #c5f06d; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .intro h2 { max-width: 20rem; margin: 0; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; }
        .intro p:last-child { max-width: 20rem; margin: 1.5rem 0 0; color: #b9cdcd; line-height: 1.7; }
        .footnote { margin: 0; color: #7fa2a0; font-size: 0.8rem; }
        .content { display: flex; align-items: center; justify-content: center; padding: clamp(2rem, 7vw, 6rem); }
        main { width: min(31rem, 100%); }
        h1 { margin: 0 0 0.65rem; font-size: clamp(1.8rem, 3vw, 2.4rem); letter-spacing: -0.02em; }
        .instructions { margin: 0 0 2rem; color: #65737c; line-height: 1.6; }
        .qr-frame { display: grid; place-items: center; padding: clamp(1rem, 4vw, 2rem); border: 1px solid #e0e8e8; border-radius: 8px; background: #f8faf9; }
        img { display: block; width: min(20rem, 100%); aspect-ratio: 1; padding: 0.75rem; background: #fff; }
        .label { margin: 1.75rem 0 0.55rem; color: #3b4a53; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
        code { overflow-wrap: anywhere; user-select: all; }
        .pairing-code { display: block; max-height: 8rem; overflow: auto; padding: 0.9rem 1rem; border: 1px solid #d6dfe1; border-radius: 6px; color: #315a59; font-size: 0.85rem; line-height: 1.5; background: #f8faf9; }
        .endpoint { margin: 1rem 0 0; color: #65737c; font-size: 0.85rem; }
        .endpoint code { color: #315a59; }
        @media (max-width: 42rem) { .shell { display: block; min-height: 100vh; } .intro { min-height: 14rem; padding: 1.75rem; } .intro h2 { font-size: 2rem; } .footnote { display: none; } .content { padding: 2.5rem 1.25rem 3rem; } }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="intro">
            <div class="mark" aria-hidden="true">O</div>
            <div>
                <p class="eyebrow">Connect a device</p>
                <h2>Your workspace, wherever you are.</h2>
            </div>
            <p class="footnote">Secure device pairing</p>
        </aside>
        <section class="content">
            <main>
                <h1>Pair Orca @@TITLE@@</h1>
                <p class="instructions">@@INSTRUCTIONS@@</p>
                <div class="qr-frame">
                    <img src="/@@QR_PATH@@" alt="Orca @@TITLE@@ pairing QR code">
                </div>
                <p class="label">Pairing code</p>
                <code class="pairing-code">@@PAIRING_URL@@</code>
                <p class="endpoint">Endpoint: <code>@@PAIRING_ENDPOINT@@</code></p>
            </main>
        </section>
    </div>
</body>
</html>
