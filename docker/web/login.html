<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in to @@PRODUCT@@</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #16212b;
            background: #f4f7f8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f4f7f8;
        }

        .shell {
            display: grid;
            grid-template-columns: minmax(18rem, 0.9fr) minmax(20rem, 1.1fr);
            width: min(70rem, 100%);
            min-height: 100vh;
            margin: auto;
            background: #fff;
            box-shadow: 0 20px 60px rgb(22 33 43 / 10%);
        }

        .intro {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(2rem, 6vw, 5rem);
            color: #fff;
            background: #173b3f;
        }

        .mark {
            display: grid;
            width: 2.75rem;
            height: 2.75rem;
            place-items: center;
            border: 1px solid rgb(255 255 255 / 32%);
            border-radius: 10px;
            color: #173b3f;
            font-weight: 800;
            background: #c5f06d;
        }

        .eyebrow {
            margin: 0 0 1rem;
            color: #c5f06d;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .intro h2 { max-width: 22rem; margin: 0; font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.05; }
        .intro p:last-child { max-width: 22rem; margin: 1.5rem 0 0; color: #b9cdcd; line-height: 1.7; }
        .footnote { margin: 0; color: #7fa2a0; font-size: 0.8rem; }

        .content {
            display: flex;
            align-items: center;
            padding: clamp(2rem, 7vw, 6rem);
        }

        main { width: min(25rem, 100%); }
        h1 { margin: 0 0 0.65rem; font-size: clamp(1.8rem, 3vw, 2.4rem); letter-spacing: -0.02em; }
        .subtitle { margin: 0 0 2.25rem; color: #65737c; line-height: 1.6; }
        form, label { display: grid; }
        form { gap: 1.15rem; }
        label { gap: 0.45rem; color: #3b4a53; font-size: 0.85rem; font-weight: 700; }
        input, button { width: 100%; min-height: 3.1rem; border-radius: 7px; font: inherit; }
        input { padding: 0.8rem 0.95rem; border: 1px solid #d6dfe1; color: #16212b; background: #f8faf9; outline: none; }
        input:focus { border-color: #2e7773; box-shadow: 0 0 0 3px rgb(46 119 115 / 16%); background: #fff; }
        button { margin-top: 0.5rem; padding: 0.8rem 1rem; border: 0; cursor: pointer; color: #173b3f; font-weight: 800; background: #c5f06d; }
        button:hover { background: #b8e85a; }
        button:disabled { cursor: wait; opacity: 0.65; }
        #error { min-height: 1.25rem; margin: 0.2rem 0 0; color: #b42318; font-size: 0.875rem; }

        @media (max-width: 42rem) {
            .shell { display: block; min-height: 100vh; }
            .intro { min-height: 14rem; padding: 1.75rem; }
            .intro h2 { font-size: 2rem; }
            .intro p:last-child, .footnote { display: none; }
            .content { padding: 2.5rem 1.75rem 3rem; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="intro">
            <div class="mark" aria-hidden="true">O</div>
            <div>
                <p class="eyebrow">Private workspace</p>
                <h2>Build what's next, securely.</h2>
                <p>Sign in to access your connected development environment from anywhere.</p>
            </div>
            <p class="footnote">@@PRODUCT@@ server</p>
        </aside>
        <section class="content">
            <main>
                <h1 id="title">Sign in to @@PRODUCT@@</h1>
                <p class="subtitle">Enter your credentials to continue to your workspace.</p>
                <form id="login-form">
            <label>
                Username
                <input name="username" autocomplete="username" autofocus required>
            </label>
            <label>
                Password
                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>
            <button type="submit">Sign in</button>
            <p id="error" role="alert"></p>
                </form>
            </main>
        </section>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button');
            button.disabled = true;
            try {
                const form = new FormData(event.currentTarget);
                const credentials = `${form.get('username')}:${form.get('password')}`;
                const response = await fetch('/auth-check', {
                    headers: { Authorization: `Basic ${btoa(credentials)}` },
                    cache: 'no-store'
                });
                if (response.ok) {
                    location.href = '/';
                } else {
                    throw new Error('Invalid credentials');
                }
            } catch {
                document.getElementById('error').textContent =
                    'Invalid username or password.';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
